<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ai-packs grid</title>
<style>
  /*FONTS*/
  :root {
    --bg: #08090b; --panel: #0e1116; --panel-2: #131821; --line: #1f2733; --line-2: #2a3442;
    --text: #f2f4f6; --muted: #9aa8b6; --dim: #5d6b79;
    --purple: #bb92ff; --cyan: #00d8dd; --gold: #e3c568; --pink: #e6b8b5; --coral: #ec9a7e;
    --red: #ff6b6b; --green: #4ade80; --amber: #fbbf24;
    --accent: linear-gradient(100deg, #e6b8b5, #bea7ee 85%);
    --mono: "JetBrains Mono", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); }
  body { font-family: Inter, Arial, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  #canvas { position: relative; width: 1080px; height: 1350px; overflow: hidden; padding: 52px 56px 0;
    background:
      radial-gradient(700px 420px at 85% -5%, rgba(187,146,255,.20), transparent 70%),
      radial-gradient(600px 380px at -5% 10%, rgba(0,216,221,.10), transparent 70%),
      var(--bg); }
  .pills { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 24px; }
  .pill { font-size: 19px; font-weight: 600; letter-spacing: .01em; padding: 9px 18px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); display: inline-flex; align-items: center; gap: 9px; }
  .pill.mono { font-family: var(--mono); font-size: 17px; font-weight: 500; }
  .pill .pd { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 10px rgba(236,154,126,.8); }
  .pills .x { color: var(--dim); font-size: 22px; }
  h1 { text-align: center; font-family: "Inter Display", Inter, sans-serif; font-weight: 800; font-size: 62px;
    line-height: 1.04; letter-spacing: -.035em; }
  h1 .accent { background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { text-align: center; color: var(--muted); font-size: 24px; margin: 16px 0 0; }
  .window { border: 1px solid var(--line); border-radius: 22px; background: rgba(14,17,22,.86); margin-top: 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45); padding: 14px 18px 16px; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 2px 4px 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .bar .title { flex: 1; text-align: center; color: var(--muted); font-size: 16px; font-family: var(--mono); }
  .chip { font-size: 15px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-family: var(--mono); }
  .chip b { color: var(--green); }
  /* prompt: a terminal input box */
  .prompt { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line-2); background: var(--panel-2);
    border-radius: 12px; padding: 14px 18px; font-family: var(--mono); font-size: 21px; }
  .prompt .gl { color: var(--coral); font-weight: 700; }
  .prompt .cmd { color: var(--purple); font-weight: 700; }
  .prompt .arg { color: var(--text); }
  .prompt .caret { width: 11px; height: 25px; background: var(--text); opacity: .85; margin-left: -6px; }
  .prompt .caret.off { opacity: 0; }
  .hint { display: flex; align-items: center; gap: 14px; margin: 8px 0 0; padding: 7px 14px; border-radius: 9px;
    font-family: var(--mono); font-size: 15px; background: rgba(187,146,255,.09); border: 1px solid rgba(187,146,255,.22); }
  .hint .hc { color: var(--purple); font-weight: 700; white-space: nowrap; }
  .hint .hd { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint.off { visibility: hidden; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 14px;
    height: 206px; display: flex; flex-direction: column; overflow: hidden; }
  .card.hl { border-color: rgba(187,146,255,.65); box-shadow: 0 0 0 1px rgba(187,146,255,.35) inset; }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .num { color: var(--dim); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .top { display: flex; align-items: center; gap: 8px; min-height: 24px; }
  .sk { font-family: var(--mono); font-size: 14px; color: var(--dim); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sk .st { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .sk .sp { display: none; color: var(--coral); font-size: 19px; line-height: 1; width: 12px; }
  .ct { font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
  .top + .ct { margin-top: 4px; }
  .tag { margin-left: auto; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .tag.block { background: rgba(255,107,107,.14); color: var(--red); }
  .tag.fix { background: rgba(251,191,36,.14); color: var(--amber); }
  .tag.ok { background: rgba(74,222,128,.14); color: var(--green); }
  .card .st.block { background: var(--red); box-shadow: 0 0 8px rgba(255,107,107,.6); }
  .card .st.fix { background: var(--amber); box-shadow: 0 0 8px rgba(251,191,36,.55); }
  .card .st.ok { background: var(--green); }
  .card .st.info { background: var(--purple); }
  .desc { color: var(--muted); font-size: 15.5px; margin-top: 3px; line-height: 1.3; }
  .pv { margin-top: auto; }
  .run { display: none; margin-top: auto; font-family: var(--mono); font-size: 14px; color: var(--muted); }
  .run .sp2 { color: var(--coral); margin-right: 8px; font-size: 19px; line-height: 1; vertical-align: -2px; }
  /* animation states: done (default), running, queued */
  .card.running .pv, .card.queued .pv, .card.running .tag, .card.queued .tag { visibility: hidden; }
  .card.running .run, .card.queued .run { display: block; }
  .card.running .run { margin-top: auto; }
  .card.running .pv, .card.queued .pv { position: absolute; }
  .card.running { border-color: rgba(236,154,126,.9); box-shadow: 0 0 0 1px rgba(236,154,126,.25) inset, 0 0 26px rgba(236,154,126,.14); }
  .card.running .run { color: var(--text); }
  .card.running .sk .st { display: none; } .card.running .sk .sp { display: inline-block; }
  .card.queued { opacity: .42; }
  .card.queued .sk .st { background: transparent; border: 1px solid var(--dim); box-shadow: none; }
  .card.hl.queued, .card.hl.running { box-shadow: none; border-color: var(--line); }
  .code { font-family: var(--mono); font-size: 13.5px; background: #0a0d12;
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; line-height: 1.45; white-space: pre; overflow: hidden; }
  .code .r { color: var(--red); } .code .g { color: var(--green); } .code .p { color: var(--purple); } .code .m { color: var(--dim); }
  .badges { display: flex; flex-wrap: wrap; gap: 7px; }
  .badge { font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
  .badge.r { color: var(--red); border-color: rgba(255,107,107,.35); }
  .badge.g { color: var(--green); border-color: rgba(74,222,128,.35); }
  .badge.a { color: var(--amber); border-color: rgba(251,191,36,.35); }
  .rows .row { display: flex; justify-content: space-between; font-size: 15px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .rows .row:last-child { border-bottom: 0; }
  .rows .k { color: var(--text); font-family: var(--mono); font-size: 14px; }
  .rows .v { font-weight: 700; font-size: 13px; }
  .v.r { color: var(--red); } .v.g { color: var(--green); } .v.a { color: var(--amber); }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dots i { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    font-style: normal; font-weight: 800; font-size: 16px; }
  .dots i.pass { background: rgba(74,222,128,.14); color: var(--green); }
  .dots i.fail { background: rgba(255,107,107,.14); color: var(--red); }
  .dots .lbl { color: var(--muted); font-size: 14.5px; margin-left: 4px; white-space: nowrap; }
  .bars { display: flex; align-items: flex-end; gap: 14px; }
  .bars .col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bars .b { width: 54px; border-radius: 7px 7px 3px 3px; }
  .bars .b.before { background: linear-gradient(180deg, #ff8f8f, #c94a4a); }
  .bars .b.after { background: linear-gradient(180deg, #7ef0a8, #2f9e5d); }
  .bars .n { font-size: 15px; font-weight: 800; }
  .bars .l { font-size: 12.5px; color: var(--muted); }
  .bars .note { font-size: 14px; color: var(--muted); margin-left: auto; text-align: right; line-height: 1.35; white-space: pre-line; }
  .verdict { display: flex; flex-direction: column; gap: 6px; }
  .verdict .big { font-family: var(--mono); font-size: 27px; font-weight: 700; color: var(--red); }
  .verdict .big.go { color: var(--green); }
  .verdict .small { color: var(--muted); font-size: 15px; }
  .status { display: flex; align-items: center; gap: 10px; margin-top: 12px; min-height: 20px; padding: 0 4px; font-family: var(--mono); font-size: 14.5px; color: var(--muted); }
  .status .ok { color: var(--green); font-weight: 700; }
  .status .sep { color: var(--dim); }
  .status .right { margin-left: auto; color: var(--dim); }
  .cta { position: absolute; left: 0; right: 0; bottom: 0; height: 168px; background: var(--accent);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #12101a; }
  .cta .line { font-size: 38px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 14px; }
  .cta .kw { background: #12101a; color: #f2eefe; border-radius: 14px; padding: 6px 18px; font-family: var(--mono); font-weight: 700; }
  .cta .foot { font-size: 18px; font-weight: 600; opacity: .78; }
</style>
</head>
<body>
<div id="canvas">
  <div class="pills" id="pills"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="window">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
      <span class="title" id="wtitle"></span>
      <span class="chip" id="chip"></span>
    </div>
    <div class="prompt"><span class="gl" id="gl"></span><span><span class="cmd" id="cmd"></span><span class="arg" id="arg"></span></span><span class="caret" id="caret"></span></div>
    <div class="hint" id="hint"><span class="hc" id="hc"></span><span class="hd" id="hd"></span></div>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>
  </div>
  <div class="cta">
    <div class="line" id="cta"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
const S = window.SPEC;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const el = id => document.getElementById(id);
const sep = S.pill_sep === undefined ? '<span class="x">×</span>' : (S.pill_sep ? `<span class="x">${esc(S.pill_sep)}</span>` : "");
el("pills").innerHTML = S.pills.map((p, i) => {
  const t = typeof p === "string" ? {t: p} : p;
  return `<span class="pill ${t.mono ? "mono" : ""}">${t.dot ? '<span class="pd"></span>' : ""}${esc(t.t)}</span>`;
}).join(sep);
el("title").innerHTML = `${esc(S.title)}<br><span class="accent">${esc(S.title_accent)}</span>`;
if (S.subtitle) el("sub").textContent = S.subtitle; else el("sub").remove();
el("wtitle").textContent = S.window_title;
if (S.chip_html) el("chip").innerHTML = S.chip_html; else el("chip").remove();
el("gl").textContent = S.prompt_glyph || "";
if (!S.prompt_glyph) el("gl").remove();
el("cmd").textContent = S.command;
el("arg").textContent = S.command_arg;
if (S.slash_hint) { el("hc").textContent = S.slash_hint.cmd; el("hd").textContent = S.slash_hint.desc; } else el("hint").remove();
if (S.status_html) el("status").innerHTML = S.status_html; else el("status").remove();
if (!S.prompt_glyph && !S.slash_hint) { el("caret").style.width = "2px"; el("caret").style.marginLeft = "0"; }
const pv = p => {
  if (!p) return "";
  if (p.type === "code") return `<div class="code">${p.html}</div>`;
  if (p.type === "badges") return `<div class="badges">${p.items.map(b => `<span class="badge ${b.c||""}">${esc(b.t)}</span>`).join("")}</div>`;
  if (p.type === "rows") return `<div class="rows">${p.items.map(r => `<div class="row"><span class="k">${esc(r.k)}</span><span class="v ${r.c||""}">${esc(r.v)}</span></div>`).join("")}</div>`;
  if (p.type === "dots") return `<div class="dots">${p.items.map(d => `<i class="${d ? "pass" : "fail"}">${d ? "✓" : "✗"}</i>`).join("")}<span class="lbl">${esc(p.label)}</span></div>`;
  if (p.type === "bars") { const m = Math.max(p.before, p.after);
    const h = v => Math.max(6, Math.round(46 * v / m));
    return `<div class="bars"><div class="col"><span class="n">${p.before}</span><span class="b before" style="height:${h(p.before)}px"></span><span class="l">${esc(p.before_label)}</span></div>
      <div class="col"><span class="n">${p.after}</span><span class="b after" style="height:${h(p.after)}px"></span><span class="l">${esc(p.after_label)}</span></div>
      <span class="note">${esc(p.note)}</span></div>`; }
  if (p.type === "verdict") return `<div class="verdict"><span class="big ${p.go ? "go" : ""}">${esc(p.big)}</span><span class="small">${esc(p.small)}</span></div>`;
  return "";
};
const stClass = c => c.dot || (c.tag ? c.tag.toLowerCase() : "info");
el("grid").innerHTML = S.cards.map(c => {
  const tag = c.tag ? `<span class="tag ${c.tag.toLowerCase()}">${esc(c.tag)}</span>` : "";
  const head = c.skill
    ? `<div class="top"><span class="sk"><i class="st ${stClass(c)}"></i><span class="sp">⠋</span>${esc(c.skill)}</span>${tag}</div><div class="ct">${esc(c.title)}</div>`
    : `<div class="head"><span class="num">${esc(c.num)}</span><span class="ct">${esc(c.title)}</span>${tag}</div>`;
  return `<div class="card ${c.highlight ? "hl" : ""}">${head}<div class="desc">${esc(c.desc)}</div>
    <div class="pv">${pv(c.preview)}</div><div class="run"><span class="sp2">⠋</span><span class="rt"></span></div></div>`;
}).join("");
el("cta").innerHTML = `${esc(S.cta_before)} <span class="kw">${esc(S.cta_keyword)}</span> ${esc(S.cta_after)}`;
el("foot").textContent = S.footer;

// Animation hooks used by render_gif.py. The static render never calls them.
const SPIN = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
window.R = {
  cards: () => [...document.querySelectorAll(".card")],
  // states: array of "done" | "running" | "queued"; tick drives the spinner glyph
  setCards(states, tick, labels) {
    this.cards().forEach((c, i) => {
      c.classList.remove("running", "queued");
      const s = states[i] || "done";
      if (s !== "done") c.classList.add(s);
      const g = SPIN[(tick + i) % SPIN.length];
      c.querySelector(".run .sp2").textContent = s === "running" ? g : "·";
      const sp = c.querySelector(".sk .sp"); if (sp) sp.textContent = g;
      c.querySelector(".run .rt").textContent = s === "running" ? labels.running : labels.queued;
    });
  },
  typed(n) {
    const full = S.command + S.command_arg;
    const t = full.slice(0, n);
    el("cmd").textContent = t.slice(0, S.command.length);
    el("arg").textContent = t.slice(S.command.length);
  },
  // free text in the prompt, with its own glyph (used for the shell intro)
  raw(glyph, text) {
    const g = el("gl"); if (g) g.textContent = glyph;
    el("cmd").textContent = ""; el("arg").textContent = text;
  },
  glyph(text) { const g = el("gl"); if (g) g.textContent = text; },
  caret(on) { el("caret").classList.toggle("off", !on); },
  hint(on) { const h = el("hint"); if (h) h.classList.toggle("off", !on); },
  status(html) { const s = el("status"); if (s) s.innerHTML = html; },
};
</script>
</body>
</html>
